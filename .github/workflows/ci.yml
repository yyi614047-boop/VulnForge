name: CI

on:
  pull_request:
  push:
    branches: [main, refactor/remove-rag-from-main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Verify real Docker internal-network isolation
        run: python -m pytest -q tests/test_docker_isolation_integration.py
        env:
          VULNFORGE_DOCKER_INTEGRATION: "1"
      - name: Verify live Metasploit RPC Check and Execute
        run: python -m pytest -q tests/test_metasploit_live_integration.py
        env:
          VULNFORGE_MSF_INTEGRATION: "1"
